name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 取得 Pages 站点地址（用于 canonical 与 sitemap）
        id: pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时，尝试自动开启（需要 pages: write 权限）
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 构建站点
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs

      - name: 站点自检
        run: node check.mjs

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
